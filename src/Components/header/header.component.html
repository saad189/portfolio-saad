<header class="site-header" [class.scrolled]="scrolled">
  <div class="container nav-inner">
    <a routerLink="/" class="logo">Saad Ahmed</a>

    <nav>
      <ul class="nav-links">
        <li><a routerLink="/" [fragment]="'about'" appFragmentLinkActive="about">About</a></li>
        <li><a routerLink="/" [fragment]="'experience'" appFragmentLinkActive="experience">Experience</a></li>
        <li><a routerLink="/" [fragment]="'education'" appFragmentLinkActive="education">Education</a></li>
        <li><a routerLink="/" [fragment]="'projects'" appFragmentLinkActive="projects">Projects</a></li>
        <li><a routerLink="/" [fragment]="'credentials'" appFragmentLinkActive="credentials">Credentials</a></li>
      </ul>
    </nav>

    <div class="nav-actions">
      <a routerLink="/" [fragment]="'contact'" class="btn btn-ghost-indigo">Contact Me</a>
      <button class="btn btn-solid" (click)="openResume()">Résumé</button>
      <button class="hamburger" aria-label="Open menu" (click)="openDrawer.emit()">
        <span></span>
      </button>
    </div>
  </div>
</header>
