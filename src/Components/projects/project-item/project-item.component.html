<article
  class="glass-card project-card"
  [class.featured]="project.isFeatured"
  appReveal
>
  <ng-container *ngIf="project.isFeatured">
    <a
      *ngIf="primaryLink; else artOnly"
      class="project-art art-link"
      [class.has-image]="project.artImageUrl"
      [href]="primaryLink"
      target="_blank"
      rel="noopener noreferrer"
      [attr.aria-label]="project.title + ' — open site'"
    >
      <img *ngIf="project.artImageUrl" [src]="project.artImageUrl" [alt]="project.title + ' logo'" class="art-image" />
      <span *ngIf="!project.artImageUrl" class="art-label">Live Web Application</span>
    </a>
    <ng-template #artOnly>
      <div class="project-art" [class.has-image]="project.artImageUrl">
        <img *ngIf="project.artImageUrl" [src]="project.artImageUrl" [alt]="project.title + ' logo'" class="art-image" />
        <span *ngIf="!project.artImageUrl" class="art-label">Live Web Application</span>
      </div>
    </ng-template>
    <div>
      <div class="project-tag-row">
        <span class="pill pill--featured">{{ project.tag }}</span>
      </div>
      <h3>{{ project.title }}</h3>
      <p>{{ project.description }}</p>
      <div class="project-stats" *ngIf="project.stats?.length">
        <span class="pill pill--metric" *ngFor="let stat of project.stats"><strong>{{ stat }}</strong></span>
      </div>
      <div class="project-tags">
        <span class="pill" *ngFor="let tag of project.techTags">{{ tag }}</span>
      </div>
      <div class="project-links" *ngIf="project.links?.length">
        <a [href]="link.href" target="_blank" rel="noopener noreferrer" class="btn btn-ghost-indigo" *ngFor="let link of project.links">{{ link.label }}</a>
      </div>
    </div>
  </ng-container>

  <ng-container *ngIf="!project.isFeatured">
    <div class="project-tag-row">
      <span class="pill" [ngClass]="'pill--' + project.tagVariant">{{ project.tag }}</span>
    </div>
    <h3>
      <a *ngIf="project.logoUrl && primaryLink" [href]="primaryLink" target="_blank" rel="noopener noreferrer" [attr.aria-label]="project.title + ' — open site'">
        <img class="project-logo is-link" [src]="project.logoUrl" [alt]="project.title + ' logo'" loading="lazy" />
      </a>
      <img *ngIf="project.logoUrl && !primaryLink" class="project-logo" [src]="project.logoUrl" [alt]="project.title + ' logo'" loading="lazy" />
      {{ project.title }}
      <span class="subtitle" *ngIf="project.subtitle">{{ project.subtitle }}</span>
    </h3>
    <p>{{ project.description }}</p>
    <div class="project-stats" *ngIf="project.stats?.length">
      <span class="pill pill--metric" *ngFor="let stat of project.stats"><strong>{{ stat }}</strong></span>
    </div>
    <div class="project-tags">
      <span class="pill" *ngFor="let tag of project.techTags">{{ tag }}</span>
    </div>
    <div class="project-links" *ngIf="project.links?.length">
      <a [href]="link.href" target="_blank" rel="noopener noreferrer" class="btn btn-ghost-indigo" *ngFor="let link of project.links">{{ link.label }}</a>
    </div>
  </ng-container>
</article>
