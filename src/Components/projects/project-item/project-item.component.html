<article
  class="glass-card project-card"
  [class.featured]="project.isFeatured"
  appReveal
>
  <ng-container *ngIf="project.isFeatured">
    <div class="project-art">
      <span class="art-label">App preview · iOS + Android</span>
    </div>
    <div>
      <div class="project-tag-row">
        <span class="pill pill--featured">{{ project.tag }}</span>
        <span class="pill">2024 — Live</span>
      </div>
      <h3>{{ project.title }}</h3>
      <p>{{ project.description }}</p>
      <div class="project-stats" *ngIf="project.stats?.length">
        <span class="pill pill--metric" *ngFor="let stat of project.stats"><strong>{{ stat }}</strong></span>
      </div>
      <div class="project-tags">
        <span class="pill" *ngFor="let tag of project.techTags">{{ tag }}</span>
      </div>
      <div class="project-links" *ngIf="project.links?.length">
        <a [href]="link.href" class="btn btn-ghost-indigo" *ngFor="let link of project.links">{{ link.label }}</a>
      </div>
    </div>
  </ng-container>

  <ng-container *ngIf="!project.isFeatured">
    <div class="project-tag-row">
      <span class="pill" [ngClass]="'pill--' + project.tagVariant">{{ project.tag }}</span>
    </div>
    <h3>
      {{ project.title }}
      <span class="subtitle" *ngIf="project.subtitle">{{ project.subtitle }}</span>
    </h3>
    <p>{{ project.description }}</p>
    <div class="project-stats" *ngIf="project.stats?.length">
      <span class="pill pill--metric" *ngFor="let stat of project.stats"><strong>{{ stat }}</strong></span>
    </div>
    <div class="project-tags">
      <span class="pill" *ngFor="let tag of project.techTags">{{ tag }}</span>
    </div>
  </ng-container>
</article>
