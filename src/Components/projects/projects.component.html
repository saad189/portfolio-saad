<section id="projects">
  <div class="container">
    <app-section-header
      id="freelance"
      eyebrow="04 — Selected work"
      title="Projects"
      subtitle="Selected work from employment and freelance engagements — featured first."
    ></app-section-header>

    <div class="projects-grid">
      <app-project-item *ngFor="let project of projects" [project]="project"></app-project-item>

      <article class="project-card placeholder glass-card" appReveal>
        <h3>More coming soon</h3>
        <p>Freelance and personal builds will live here as they ship — honest space, not filler.</p>
      </article>
    </div>
  </div>
</section>
