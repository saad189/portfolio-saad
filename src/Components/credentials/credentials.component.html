<section id="credentials">
  <div class="container">
    <app-section-header
      eyebrow="06 — Verified"
      title="Credentials"
      subtitle="Professional certifications, verifiable on issuer platforms."
    ></app-section-header>

    <div class="cert-grid">
      <app-certificate-item
        *ngFor="let cert of certificates"
        [certificate]="cert"
        appReveal
      ></app-certificate-item>
    </div>
  </div>
</section>
