<a [href]="certificate.url" target="_blank" rel="noopener noreferrer" class="glass-card cert-card">
  <div class="cert-badge" [ngClass]="certificate.offeredOrg.toLowerCase()">
    {{ certificate.offeredOrg === 'Microsoft' ? 'MS' : 'U' }}
  </div>
  <div class="cert-body">
    <div class="cert-org">
      <span>{{ certificate.offeredOrg }}</span>
      <span class="pill pill--metric" *ngIf="certificate.isVerified" style="padding:1px 8px;font-size:0.6rem;">Verified</span>
    </div>
    <p class="cert-name">{{ certificate.name }}</p>
    <p class="cert-date">{{ certificate.completionDate }}</p>
  </div>
  <span class="cert-arrow">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="7" y1="17" x2="17" y2="7"></line>
      <polyline points="7 7 17 7 17 17"></polyline>
    </svg>
  </span>
</a>
