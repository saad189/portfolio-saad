<div class="timeline-item" [class.past]="job.isPast" appReveal>
  <span class="timeline-dot"></span>
  <article class="glass-card">
    <header class="job-head">
      <a *ngIf="job.logoUrl && job.companyUrl" [href]="job.companyUrl" target="_blank" rel="noopener noreferrer" [attr.aria-label]="job.company + ' — open site'">
        <img class="company-logo is-link" [src]="job.logoUrl" [alt]="job.company + ' logo'" loading="lazy" />
      </a>
      <img *ngIf="job.logoUrl && !job.companyUrl" class="company-logo" [src]="job.logoUrl" [alt]="job.company + ' logo'" loading="lazy" />
      <div class="job-head-left">
        <a *ngIf="job.companyUrl" class="company company-link" [href]="job.companyUrl" target="_blank" rel="noopener noreferrer">
          {{ job.company }}
          <svg class="ext-icon" width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 2H2a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h7a1 1 0 0 0 1-1V7"/>
            <polyline points="8 1 11 1 11 4"/>
            <line x1="11" y1="1" x2="5.5" y2="6.5"/>
          </svg>
        </a>
        <span *ngIf="!job.companyUrl" class="company">{{ job.company }}</span>
        <span class="role">{{ job.role }}</span>
      </div>
      <span class="pill pill--current" *ngIf="job.isCurrent">Current</span>
    </header>
    <div class="job-meta">
      <span>{{ job.duration }}</span>
      <ng-container *ngIf="job.tenure">
        <span class="sep"></span>
        <span>{{ job.tenure }}</span>
      </ng-container>
      <span class="sep"></span>
      <span>{{ job.location }}</span>
    </div>
    <p class="job-description">{{ job.description }}</p>
    <div class="job-stats" *ngIf="job.stats && job.stats.length">
      <span class="pill pill--metric" *ngFor="let stat of job.stats"><strong>{{ stat }}</strong></span>
    </div>
    <div class="job-tags">
      <span class="pill" *ngFor="let tag of job.techTags">{{ tag }}</span>
    </div>
  </article>
</div>
