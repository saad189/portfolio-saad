<html lang="en">

<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#16181c; --panel:rgba(22,24,29,.9); --line:#30333b; --ink:#ece8df; --muted:#a29d92;
  --accent:#ff8a3d; --accent-ink:#2a1405; --hw:#4fd1c5;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Barlow",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
  /* layout: full-bleed WebGL room; title top-left, camera views top-right, tool rail along the bottom, item sheet above the rail */
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0}
#stage canvas{display:block;outline:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font:500 12px/1 var(--body);padding:5px 8px 5px 7px;border-radius:999px;background:rgba(14,15,18,.8);border:1px solid var(--line);color:var(--ink);display:none}
.lbl i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:0}
header{position:absolute;top:14px;left:16px;pointer-events:none}
h1{font:600 26px/1 var(--display);letter-spacing:.01em;margin:0;text-wrap:balance}
.sub{font:400 12px/1.4 var(--mono);color:var(--muted);margin-top:5px}
#views{position:absolute;top:12px;right:12px;display:flex;gap:2px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
button{font:500 13px/1 var(--body);color:var(--ink);background:transparent;border:1px solid transparent;border-radius:7px;padding:8px 11px;cursor:pointer;white-space:nowrap;flex:none}
button:hover{background:#272a32}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#rail{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:6px;align-items:center;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow-x:auto;scrollbar-width:none}
#rail::-webkit-scrollbar{display:none}
#rail button{border-color:var(--line)}
#rail button[aria-pressed="true"]{border-color:var(--accent)}
.sep{width:1px;align-self:stretch;background:var(--line);flex:none;margin:0 2px}
label.sel{display:flex;align-items:center;gap:6px;font:500 12px var(--body);color:var(--muted);flex:none}
select{font:500 13px var(--body);color:var(--ink);background:#20232a;border:1px solid var(--line);border-radius:7px;padding:7px 8px}
#sheet{position:absolute;left:12px;bottom:74px;width:min(380px,calc(100% - 24px));box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px 16px;display:none}
#sheet.open{display:block}
#sheet h2{font:600 22px/1.1 var(--display);margin:0 30px 6px 0}
.dims{font:400 12px/1.5 var(--mono);color:var(--accent)}
#sNote{font:400 14px/1.5 var(--body);color:#d8d4ca;margin:8px 0 0}
#sClose{position:absolute;top:8px;right:8px;font-size:18px;padding:4px 9px;color:var(--muted)}
#sActions{display:flex;gap:6px;margin-top:12px}
#sActions button{border-color:var(--line)}
#sActions button.danger{color:#ffb4a2;border-color:#5a3029}
#sList{display:none;flex-direction:column;gap:6px;margin-top:10px;max-height:40vh;overflow-y:auto}
#sList .row{display:flex;align-items:center;justify-content:space-between;gap:10px;font:500 14px var(--body);padding:6px 0;border-top:1px solid var(--line)}
#sList button{border-color:var(--line)}
#rail button:disabled{opacity:.45;cursor:default}
#toast button{margin-left:10px;padding:5px 9px;background:#1a1a1a;color:#f2efe8;border-radius:6px}
#copyBox{display:none;width:100%;box-sizing:border-box;height:120px;margin-top:10px;background:#101114;color:var(--ink);border:1px solid var(--line);border-radius:7px;font:400 11px/1.4 var(--mono);padding:8px}
#hint{position:absolute;left:50%;top:64px;transform:translateX(-50%);font:500 13px var(--body);background:var(--accent);color:var(--accent-ink);padding:8px 12px;border-radius:8px;display:none;white-space:nowrap}
#toast{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);font:500 13px var(--body);background:#f2efe8;color:#1a1a1a;padding:9px 13px;border-radius:8px;display:none;max-width:calc(100% - 40px);text-align:center}
#fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--muted);font:400 15px/1.5 var(--body)}
@media (max-width:700px){
  h1{font-size:22px}
  #views{top:66px;left:12px;right:12px;overflow-x:auto;scrollbar-width:none}
  #views button{flex:1 0 auto;padding:8px 9px}
  #hint{top:118px;white-space:normal;width:calc(100% - 48px);text-align:center}
  #sheet{bottom:72px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</section>

  <button id="tNight" aria-pressed="false">Night</button>
  <button id="tEdit" aria-pressed="false">Edit layout</button>
  <button id="tDoors" aria-pressed="false">Open cabinets</button>
  <button id="tCorner">Corner: Boxing bag</button>
  <label class="sel" id="woodWrap" for="woodSel">Shelf wood
    <select id="woodSel">
      <option value="oak">Light oak</option>
      <option value="walnut">Walnut</option>
      <option value="teak">Teak</option>
      <option value="grey">Grey paint</option>
      <option value="white">White</option>
    </select>
  </label>
  <span class="sep"></span>
  <label class="sel" for="fin">Cabinets
    <select id="fin">
      <option value="wood">Wood (current)</option>
      <option value="charcoal">Charcoal wrap</option>
      <option value="white">White wrap</option>
      <option value="navy">Navy wrap</option>
    </select>
  </label>
  <label class="sel" for="led">LEDs
    <select id="led">
      <option value="warm">Warm white</option>
      <option value="white">Cool white</option>
      <option value="purple">Purple</option>
      <option value="cyan">Cyan</option>
      <option value="rgb">RGB cycle</option>
      <option value="off">Off</option>
    </select>
  </label>
  <span class="sep"></span>
  <button id="bRemoved">Removed (0)</button>
  <button id="bCopy">Copy layout</button>
  <button id="bReset">Reset</button>
</div>
<div id="toast" role="status"></div>
<div id="fallback">The 3D view could not start in this browser. Try opening the page in Chrome or Safari.</div>

<script>
setTimeout(function(){ if(!window.__labReady){ var f=document.getElementById('fallback'); f.style.display='flex'; } }, 9000);

    b.addEventListener('click', () => { setHidden(it, false); gone.length > 1 ? showRemoved() : deselect(); }); row.append(nm, b); sList.appendChild(row); }
  if (gone.length > 1) { const row = document.createElement('div'); row.className = 'row'; const b = document.createElement('button'); b.textContent = 'Restore all';
    b.addEventListener('click', () => { gone.forEach(i => i.hidden = false); save(); syncUI(); deselect(); }); row.append(document.createElement('span'), b); sList.appendChild(row); }
  sList.style.display = 'flex'; sheet.classList.add('open'); }
$('bRemoved').addEventListener('click', showRemoved);
function applyCorner(rebuild) { byId.bag.off = S.corner !== 'bag'; byId.bookshelf.off = S.corner === 'bag';
  M.shelfWood.color.set(WOODS[S.shelfWood] || WOODS.oak);
  if (rebuild) placeItem(byId.bookshelf);
  if (selId && byId[selId].off) deselect();
  $('tCorner').textContent = 'Corner: ' + CORNER[S.corner]; $('woodWrap').style.display = S.corner === 'shelf-wood' ? 'flex' : 'none'; $('woodSel').value = S.shelfWood; }
$('tCorner').addEventListener('click', () => { S.corner = CORNER_ORDER[(CORNER_ORDER.indexOf(S.corner) + 1) % CORNER_ORDER.length]; applyCorner(true); save();
  toast(S.corner === 'bag' ? 'Corner: boxing bag' : `Corner: ${CORNER[S.corner].toLowerCase()}`); });
$('woodSel').addEventListener('change', e => { S.shelfWood = e.target.value; applyCorner(false); save(); });
$('tLabels').addEventListener('click', () => { S.labels = !S.labels; syncUI(); save(); });
$('tNight').addEventListener('click', () => { S.night = !S.night; applyLighting(); syncUI(); save(); });
$('tEdit').addEventListener('click', () => { S.edit = !S.edit; syncUI(); });
$('tDoors').addEventListener('click', () => { S.doors = !S.doors; const ids = new Set(doors.map(dr => dr.id)); ids.forEach(id => byId[id]._open = S.doors); setDoorTargets(); syncUI(); });
$('fin').addEventListener('change', e => { S.finish = e.target.value; applyFinish(); save(); });
$('led').addEventListener('change', e => { S.led = e.target.value; applyLed(); save(); });
$('bCopy').addEventListener('click', async () => {
  const data = { room:{ w:ROOM.w, d:ROOM.d }, cabinets:S.finish, leds:S.led, corner:S.corner, shelfWood:S.shelfWood,
    items:ITEMS.map(({ id, name, x, y, rot, elev, hidden }) => ({ id, name, x, y, rot, ...(elev != null ? { elev } : {}), ...(hidden ? { hidden:true } : {}) })) };
  const txt = JSON.stringify(data);
  try { await navigator.clipboard.writeText(txt); toast('Layout copied. Paste it to Claude with the change you want.'); }
  catch (_) { sName.textContent = 'Layout data'; sDims.textContent = 'Select all and copy, then paste it to Claude.'; sNote.textContent = '';
    $('sActions').style.display = 'none'; sList.style.display = 'none'; copyBox.value = txt; copyBox.style.display = 'block'; sheet.classList.add('open'); copyBox.focus(); copyBox.select(); } });
$('bReset').addEventListener('click', () => { try { localStorage.removeItem(KEY); } catch (_) {}
  ITEMS = JSON.parse(JSON.stringify(DEFAULT_ITEMS)); reindex(); deselect(); ITEMS.forEach(placeItem);
  Object.assign(S, { labels:true, night:false, finish:'white', led:'warm', doors:false, corner:'shelf-wood', shelfWood:'white' }); applyFinish(); applyLed(); applyCorner(true); syncUI(); toast('Layout reset to the original plan.'); });

/* ---------- boot ---------- */
load();
ITEMS.forEach(placeItem);
buildLabels(); applyFinish(); applyLed(); applyCorner(false); syncUI();
goView('overview', true);
window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });

const clock = new THREE.Clock(), COL = new THREE.Color();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (tw) { let k = Math.min(1, (performance.now() - tw.s) / tw.d); const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    camera.position.lerpVectors(tw.p0, tw.p1, e); controls.target.lerpVectors(tw.t0, tw.t1, e); camera.fov = tw.f0 + (tw.f1 - tw.f0) * e; camera.updateProjectionMatrix(); if (k >= 1) tw = null; }
  controls.update();
  const c = camera.position, hid = {};
  for (const k in walls) { hid[k] = walls[k].test(c); walls[k].g.visible = !hid[k]; }
  for (const it of ITEMS) { const g = groups[it.id]; if (g) g.visible = !it.hidden && !it.off && !(it.wall && hid[it.wall]); }
  if (!reduceMotion) { for (const s of spinners) s.rotation.y += dt * 9; for (const b of blinkers) b.m.visible = Math.sin(t * b.f + b.p) > -0.25; }
  for (const dr of doors) { if (dr.o !== dr.tgt) { dr.o = reduceMotion ? dr.tgt : dr.o + (dr.tgt - dr.o) * Math.min(1, dt * 7); if (Math.abs(dr.tgt - dr.o) < 0.002) dr.o = dr.tgt; applyDoor(dr); } }
  if (S.led === 'rgb') { COL.setHSL((t * 0.08) % 1, 0.85, 0.55); M.led.color.copy(COL); M.led.emissive.copy(COL); ledLights.forEach(l => l.color.copy(COL)); }
  if (selBox) selBox.update();
  renderer.render(scene, camera);
  updateLabels();
  requestAnimationFrame(frame);
}
window.__labReady = true;
frame();
</script>
