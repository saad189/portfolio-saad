<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Hidden Designs</title>
<link rel="icon" href="/favicon.svg">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#15181d; --mut:#5b6470; --line:rgba(20,24,30,.12); --acc:#4f46e5; color-scheme:light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1014; --card:#171a20; --ink:#eceef2; --mut:#9aa1ad; --line:rgba(255,255,255,.1); --acc:#818cf8; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; background:var(--bg); color:var(--ink);
         font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { width:100%; max-width:560px; }
  h1 { font:600 22px/1.2 ui-monospace,"JetBrains Mono",monospace; margin:0 0 4px; }
  p { color:var(--mut); margin:0 0 20px; }
  nav { display:grid; gap:12px; }
  a { display:block; padding:16px 18px; border:1px solid var(--line); border-radius:12px; background:var(--card); color:inherit; text-decoration:none;
      transition:border-color .15s, transform .15s; }
  a:hover, a:focus-visible { border-color:var(--acc); transform:translateY(-1px); outline:none; }
  a b { display:block; font-weight:600; }
  a span { color:var(--mut); font-size:13.5px; }
</style>
</head>
<body>
<main>
  <h1>Hidden designs</h1>
  <p>3D design models. Not linked from the portfolio.</p>
  <nav>
    <a href="/hidden/designs/office-redesign/"><b>Office redesign →</b><span>Lab room 3D model, editable layout</span></a>
    <a href="/hidden/designs/mill-area/"><b>Mill area →</b><span>Rice + flour mill compound expansion, 3D site model</span></a>
  </nav>
</main>
</body>
</html>
