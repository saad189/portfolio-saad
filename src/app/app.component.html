<mat-sidenav-container [hasBackdrop]="true" class="sidenav-container">
  <mat-sidenav #drawer class="sidenav" position="end" mode="over">
    <nav class="mobile-nav">
      <a routerLink="/main" [fragment]="'about'" (click)="drawer.close()">About</a>
      <a routerLink="/main" [fragment]="'experience'" (click)="drawer.close()">Experience</a>
      <a routerLink="/main" [fragment]="'projects'" (click)="drawer.close()">Projects</a>
      <a routerLink="/main" [fragment]="'credentials'" (click)="drawer.close()">Credentials</a>
      <a routerLink="/main" [fragment]="'contact'" (click)="drawer.close()">Contact</a>
      <div class="drawer-actions">
        <a href="assets/Resume_SaadAhmed.pdf" target="_blank" class="btn btn-solid">Résumé</a>
      </div>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content>
    <app-header (openDrawer)="drawer.open()"></app-header>
    <router-outlet></router-outlet>
    <app-footer></app-footer>
  </mat-sidenav-content>
</mat-sidenav-container>
